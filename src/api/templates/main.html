<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script>
    (function(){
      try {
        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = saved || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem("theme", theme);
      } catch(e) { /* ignore */ }
    })();
  </script>

  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">

  <script src="https://cdn.jsdelivr.net/npm/echarts@6/dist/echarts.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/theme/dark.js" defer></script>

  <title>V-Tuber Clips stats</title>

</head>
<body class="bg-base-50 min-h-screen">

  <div class="container mx-auto p-4 space-y-4">

    <div class="flex items-center justify-between gap-4">
      <div id="header-info" class="text-base-content text-sm opacity-90 transition-opacity">
        Loading...
      </div>

      <div class="flex items-center gap-2">

        <label class="flex cursor-pointer items-center gap-2">
          <span>Light</span>
          <input id="theme-toggle" type="checkbox" class="toggle" />
          <span>Dark</span>
        </label>

        <script>
          const toggle = document.getElementById("theme-toggle");
          const saved = localStorage.getItem("theme");

          if (saved === "dark") {
            toggle.checked = true;
          } else if (saved === "light") {
            toggle.checked = false;
          } else {
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            toggle.checked = prefersDark;
          }
        </script>

      </div>
    </div>

    <div id="tabs-wrapper" class="sticky top-0 z-40 bg-base-100 py-2 -mx-4 px-4 border-b border-base-200">
      <div role="tablist" class="tabs tabs-boxed">
        <button class="tab" data-tab="overview">Overview</button>
        <button class="tab" data-tab="talent">Talent</button>
       <!--<button class="tab" data-tab="misc">misc</button>-->
      </div>
    </div>

    <main id="main-content" class="space-y-4">
      <div id="controls-area" class="space-y-4">
      </div>

      <div id="cards-area" class="space-y-4">
      </div>

      <div id="links-area" class="space-y-4">
      </div>

      <div id="about-area" class="space-y-4">
      </div>
    </main>

    <footer class="mt-8 py-4 border-t border-base-200 text-center text-sm text-base-content/80">
      Auto-updated stats and visualizations for HoloEN-related YT videos.
      Auto-updated stats and visualizations for HoloEN-related YT videos.<br>
        <a href="#" id="contact-link" class="link link-primary">Leave a message</a><br>
      2026
    </footer>
  </div>

  <script type="module" src="{{ url_for('static', path='js/main.js') }}"></script>
</body>
</html>
