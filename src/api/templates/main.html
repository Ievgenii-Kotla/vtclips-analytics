<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Immediately apply stored theme to avoid flash -->
  <script>
    (function(){
      try {
        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = saved || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem("theme", theme);
      } catch(e) { /* ignore */ }
    })();
  </script>

  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">

  <!-- eCharts (preload to make charts appear faster) -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@6/dist/echarts.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/theme/dark.js" defer></script>

  <title>Dashboard</title>

  <style>
    /* small helpers when not using full Tailwind build */
    .fade { transition: opacity .25s ease, transform .25s ease; }
    .fade-enter { opacity: 0; transform: translateY(6px); }
    .fade-enter.fade-enter-active { opacity: 1; transform: translateY(0); }
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.03) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.2s infinite;
    }
    @keyframes shimmer { from { background-position: 200% 0 } to { background-position: -200% 0 } }
  </style>
</head>
<body class="bg-base-50 min-h-screen">

  <div class="container mx-auto p-4 space-y-4">

    <!-- TOP LINE -->
    <div class="flex items-center justify-between gap-4">
      <!-- Header info from FastAPI -->
      <div id="header-info" class="text-base-content text-sm opacity-90 transition-opacity">
        <!-- Placeholder: fetch '/header-info' to populate text -->
        Loading...
      </div>

      <!-- Theme toggle -->
      <div class="flex items-center gap-2">

        <label class="flex cursor-pointer items-center gap-2">
          <span>Light</span>
          <input id="theme-toggle" type="checkbox" class="toggle" />
          <span>Dark</span>
        </label>

        <script>
          const toggle = document.getElementById("theme-toggle");
          const saved = localStorage.getItem("theme");

          if (saved === "dark") {
            toggle.checked = true;
          } else if (saved === "light") {
            toggle.checked = false;
          } else {
            // no saved theme, fallback to system preference
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            toggle.checked = prefersDark;  // true if system prefers dark
          }
        </script>

      </div>
    </div>



    <!-- SECOND LINE: TABS -->
    <div id="tabs-wrapper" class="sticky top-0 z-40 bg-base-100 py-2 -mx-4 px-4 border-b border-base-200">
      <div role="tablist" class="tabs tabs-boxed">
        <!-- data-tab values will be used in fetch -->
        <button class="tab" data-tab="overview">Overview</button>
        <button class="tab" data-tab="2025">2025</button>
        <button class="tab" data-tab="tab3">Tab 3</button>
        <button class="tab" data-tab="tab4">Tab 4</button>
        <button class="tab" data-tab="misc">Miscellaneous</button>
      </div>
    </div>

    <!-- CARDS AREA -->
    <main id="cards-area" class="space-y-4">
      <!-- Cards are rendered here. Each card is 1 per row (vertical list). -->
      <!-- Initially, load default tab (tab1) -->
    </main>

    <!-- FOOTER -->
    <footer class="mt-8 py-4 border-t border-base-200 text-center text-sm text-base-content/80">
      Footer text / small notes go here.
    </footer>
  </div>

  <script type="module" src="{{ url_for('static', path='js/main.js') }}"></script>
</body>
</html>
