services:
  python-api:
    build:
      context: .
      dockerfile: Dockerfile-api
    image: python-api-image
    container_name: python-api
    restart: unless-stopped
    init: true
    env_file: ./.env.api
    depends_on:
      - postgres-db
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - backend
    expose:
      - "8000"

  python-vtc:
    build:
      context: .
      dockerfile: Dockerfile-vtc
    container_name: python-vtc
    restart: unless-stopped
    init: true
    env_file: ./.env.vtc
    volumes:
      - ./logs:/app/logs
      - ./state:/app/state
    depends_on:
      - postgres-db
      - migrate_db
    networks:
      - backend

  postgres-db:
    image: postgres:latest
    container_name: postgres-db
    restart: unless-stopped
    env_file:
      - ./.env.db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/initial_data:/app/data/initial_data
      - ./data/backups:/app/data/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    expose:
      - "5432"

  migrate_db:
    image: python-api-image
    entrypoint: [ "alembic", "upgrade", "head" ]
    env_file: ./.env.db
    restart: "no"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - backend

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    env_file:
      - ./.env.pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres-db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - backend

  proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - python-api
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
    driver: local
  pgadmin_data:
